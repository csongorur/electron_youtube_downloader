<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>grab</title>
<style>
  :root {
    color-scheme: light;
    --chassis: #DEDCD6;
    --panel:   #F2F1ED;
    --ink:     #000000;
    --dim:     #6B6862;
    --rule:    #B9B6AE;
    --amber:   #E5A00D;
    --alert:   #B5391F;
    --display: ui-monospace, "SF Mono", Menlo, monospace;
    --face:    "Futura", "Avenir Next", "Century Gothic", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    background: var(--chassis);
    color: var(--ink);
    font-family: var(--face);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ---- top rail ---- */

  .rail {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    height: 54px;
    padding: 0 26px;
    border-bottom: 1px solid var(--rule);
    -webkit-app-region: drag;
  }

  .mark {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.01em;
  }

  .lamp {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--rule);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
  }

  [data-state="ready"] .lamp,
  [data-state="working"] .lamp { background: var(--amber); }
  [data-state="invalid"] .lamp,
  [data-state="error"] .lamp   { background: var(--alert); }

  .status {
    font-family: var(--display);
    font-size: 11px;
    line-height: 1;
    color: var(--dim);
  }

  [data-state="invalid"] .status,
  [data-state="error"] .status { color: var(--alert); }

  /* ---- console ---- */

  .console {
    align-self: center;
    width: min(560px, 100% - 52px);
    margin: 0 auto;
    padding: 0 0 44px;
  }

  .well {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 20px 22px 22px;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.07);
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }

  .well:focus-within {
    border-color: var(--ink);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.07), 0 0 0 3px rgba(229, 160, 13, 0.35);
  }

  #youtube_link {
    display: block;
    width: 100%;
    border: 0;
    padding: 0;
    background: none;
    font-family: var(--display);
    font-size: 22px;
    line-height: 1.45;
    color: var(--ink);
    caret-color: var(--amber);
    user-select: text;
  }

  #youtube_link:focus { outline: none; }
  #youtube_link::placeholder { color: #A9A69E; }

  .meter {
    height: 2px;
    margin-top: 22px;
    background: var(--rule);
  }

  .meter span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--amber);
    transition: width 200ms linear;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-top: 18px;
  }

  .destination {
    font-family: var(--display);
    font-size: 11px;
    color: var(--dim);
  }

  .key {
    flex: none;
    border: 0;
    padding: 13px 30px;
    border-radius: 3px;
    background: var(--ink);
    color: var(--chassis);
    font-family: var(--face);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
    transition: transform 60ms ease, box-shadow 60ms ease;
  }

  .key:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 rgba(0, 0, 0, 0.45);
  }

  .key:focus-visible {
    outline: 3px solid var(--amber);
    outline-offset: 2px;
  }

  .key[disabled] {
    background: none;
    color: var(--dim);
    box-shadow: inset 0 0 0 1px var(--rule);
    cursor: default;
    transform: none;
  }

  .hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body data-state="idle">

  <header class="rail">
    <div class="mark"><i class="lamp"></i>grab</div>
    <p class="status" id="status" role="status">Waiting for a link</p>
  </header>

  <main class="console">
    <form id="deck" novalidate>
      <div class="well">
        <label class="hidden" for="youtube_link">YouTube link</label>
        <input
          type="text"
          id="youtube_link"
          placeholder="https://youtube.com/watch?…"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          autofocus>
        <div class="meter"><span id="meter_fill"></span></div>
      </div>

      <div class="controls">
        <p class="destination">Saves an MP3 to your Downloads folder</p>
        <button class="key" id="download" type="submit" disabled>Download</button>
      </div>
    </form>
  </main>

<script>
  const deck = document.getElementById('deck');
  const field = document.getElementById('youtube_link');
  const key = document.getElementById('download');
  const statusLine = document.getElementById('status');
  const meterFill = document.getElementById('meter_fill');

  const YOUTUBE = /^(https?:\/\/)?((www|m|music)\.)?(youtube\.com\/(watch\?|shorts\/|live\/|embed\/)|youtu\.be\/)\S+/i;

  const setState = (state, message) => {
    document.body.dataset.state = state;
    statusLine.textContent = message;
  };

  const progress = (ratio) => {
    meterFill.style.width = Math.round(ratio * 100) + '%';
  };

  field.addEventListener('input', () => {
    const link = field.value.trim();
    progress(0);

    if (!link) {
      key.disabled = true;
      setState('idle', 'Waiting for a link');
    } else if (YOUTUBE.test(link)) {
      key.disabled = false;
      setState('ready', 'Ready to download');
    } else {
      key.disabled = true;
      setState('invalid', 'That link is not from YouTube');
    }
  });

  if (window.grab) window.grab.onProgress(progress);

  deck.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (key.disabled) return;

    // Downloading lives in the main process; the renderer only asks for it.
    if (!window.grab) {
      setState('error', 'No downloader connected yet');
      return;
    }

    key.disabled = true;
    field.readOnly = true;
    progress(0);
    setState('working', 'Downloading');

    const result = await window.grab.download(field.value.trim());

    if (result.ok) {
      progress(1);
      setState('ready', 'Downloaded ' + result.file);
    } else {
      progress(0);
      setState('error', result.message);
    }

    key.disabled = false;
    field.readOnly = false;
  });

</script>

</body>
</html>
